<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Navigation - Green</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
        }

        .canvas {
            position: relative;
            width: 1300px;
            height: 920px;
            background: #00FF00;
        }

        .square {
            position: absolute;
            width: 90px;
            height: 90px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .red-square {
            background: #FF0000;
        }

        .red-square:hover {
            background-color: rgba(255, 255, 255, 0.7);
        }

        .blue-square {
            background: #0000FF;
        }

        .blue-square:hover {
            background-color: rgba(255, 255, 255, 0.7);
        }

        .yellow-square {
            background: #FFD700;
        }

        .yellow-square:hover {
            background-color: rgba(255, 255, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="canvas">
        <!-- Red squares -->
        <a href="red.html" class="square red-square" style="left: 424px; top: 236px;"></a>
        <a href="red.html" class="square red-square" style="left: 786px; top: 236px;"></a>
        <a href="red.html" class="square red-square" style="left: 424px; top: 416px;"></a>
        <a href="red.html" class="square red-square" style="left: 786px; top: 416px;"></a>
        <a href="red.html" class="square red-square" style="left: 424px; top: 596px;"></a>
        <a href="red.html" class="square red-square" style="left: 786px; top: 596px;"></a>

        <!-- Blue squares -->
        <a href="blue.html" class="square blue-square" style="left: 514px; top: 326px;"></a>
        <a href="blue.html" class="square blue-square" style="left: 696px; top: 326px;"></a>
        <a href="blue.html" class="square blue-square" style="left: 514px; top: 506px;"></a>
        <a href="blue.html" class="square blue-square" style="left: 696px; top: 506px;"></a>

        <!-- Yellow square (navigate to home) -->
        <a href="index.html" class="square yellow-square" style="left: 604px; top: 416px;"></a>
    </div>
</body>
</html>
