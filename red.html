<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Navigation - Red</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
        }

        .container {
            position: relative;
            display: inline-block;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
            cursor: pointer;
        }

        area {
            cursor: pointer;
        }

        area:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="red.png" usemap="#navigation-map" alt="Red">
        <map name="navigation-map">
            <!-- Blue squares -->
            <area shape="rect" coords="514,326,604,416" href="blue.html" alt="Go to Blue">
            <area shape="rect" coords="696,326,786,416" href="blue.html" alt="Go to Blue">
            <area shape="rect" coords="514,506,604,596" href="blue.html" alt="Go to Blue">
            <area shape="rect" coords="696,506,786,596" href="blue.html" alt="Go to Blue">

            <!-- Green square (center) -->
            <area shape="rect" coords="604,416,696,506" href="green.html" alt="Go to Green">
        </map>
    </div>
</body>
</html>
