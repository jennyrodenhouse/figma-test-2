<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Navigation - Blue</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
        }

        .container {
            position: relative;
            display: inline-block;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
            cursor: pointer;
        }

        area {
            cursor: pointer;
        }

        area:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="blue.png" usemap="#navigation-map" alt="Blue">
        <map name="navigation-map">
            <!-- Red squares -->
            <area shape="rect" coords="424,236,514,326" href="red.html" alt="Go to Red">
            <area shape="rect" coords="786,236,876,326" href="red.html" alt="Go to Red">
            <area shape="rect" coords="424,416,514,506" href="red.html" alt="Go to Red">
            <area shape="rect" coords="786,416,876,506" href="red.html" alt="Go to Red">
            <area shape="rect" coords="424,596,514,686" href="red.html" alt="Go to Red">
            <area shape="rect" coords="786,596,876,686" href="red.html" alt="Go to Red">

            <!-- Green square (center) -->
            <area shape="rect" coords="604,416,696,506" href="green.html" alt="Go to Green">
        </map>
    </div>
</body>
</html>
