<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Navigation - Blue</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
        }

        .canvas {
            position: relative;
            width: 1300px;
            height: 920px;
            background: #0000FF;
        }

        .square {
            position: absolute;
            width: 90px;
            height: 90px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .red-square {
            background: #FF0000;
        }

        .red-square:hover {
            background-color: rgba(255, 255, 255, 0.7);
        }

        .green-square {
            background: #00FF00;
        }
    </style>
</head>
<body>
    <div class="canvas">
        <!-- Red squares -->
        <a href="red.html" class="square red-square" style="left: 424px; top: 236px;"></a>
        <a href="red.html" class="square red-square" style="left: 786px; top: 236px;"></a>
        <a href="red.html" class="square red-square" style="left: 424px; top: 416px;"></a>
        <a href="red.html" class="square red-square" style="left: 786px; top: 416px;"></a>
        <a href="red.html" class="square red-square" style="left: 424px; top: 596px;"></a>
        <a href="red.html" class="square red-square" style="left: 786px; top: 596px;"></a>

        <!-- Green square (center) -->
        <a href="green.html" class="square green-square" style="left: 604px; top: 416px;"></a>
    </div>
</body>
</html>
