<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Navigation - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
        }

        .canvas {
            position: relative;
            width: 1300px;
            height: 920px;
            background: #FFD700;
        }

        .square {
            position: absolute;
            width: 90px;
            height: 90px;
            cursor: pointer;
            text-decoration: none;
            transition: background-color 0.3s ease;
        }

        .red-square {
            background: #FF0000;
        }

        .red-square:hover {
            background-color: rgba(255, 255, 255, 0.7);
        }

        .blue-square {
            background: #0000FF;
        }

        .blue-square:hover {
            background-color: rgba(255, 255, 255, 0.7);
        }

        .green-square {
            background: #00FF00;
        }

        .green-square:hover {
            background-color: rgba(255, 255, 255, 0.7);
        }

        .squiggle-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .squiggle-path {
            fill: none;
            stroke: #000000;
            stroke-width: 35;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
    </style>
</head>
<body>
    <div class="canvas">
        <!-- Red squares -->
        <a href="red.html" class="square red-square" style="left: 424px; top: 236px;"></a>
        <a href="red.html" class="square red-square" style="left: 786px; top: 236px;"></a>
        <a href="red.html" class="square red-square" style="left: 424px; top: 416px;"></a>
        <a href="red.html" class="square red-square" style="left: 786px; top: 416px;"></a>
        <a href="red.html" class="square red-square" style="left: 424px; top: 596px;"></a>
        <a href="red.html" class="square red-square" style="left: 786px; top: 596px;"></a>

        <!-- Blue squares -->
        <a href="blue.html" class="square blue-square" style="left: 514px; top: 326px;"></a>
        <a href="blue.html" class="square blue-square" style="left: 696px; top: 326px;"></a>
        <a href="blue.html" class="square blue-square" style="left: 514px; top: 506px;"></a>
        <a href="blue.html" class="square blue-square" style="left: 696px; top: 506px;"></a>

        <!-- Green square (center) -->
        <a href="green.html" class="square green-square" style="left: 604px; top: 416px;"></a>

        <!-- Squiggly line overlay -->
        <svg class="squiggle-overlay" viewBox="0 0 1300 920" xmlns="http://www.w3.org/2000/svg">
            <path class="squiggle-path" d="M 150,250 Q 200,100 350,120 T 520,280 Q 550,350 480,420 Q 450,450 420,500 T 350,650 Q 320,720 380,800 Q 420,850 500,870 Q 600,900 700,860 Q 780,830 850,750 Q 900,690 950,600 Q 980,550 1020,500 Q 1050,460 1100,450 Q 1150,440 1180,480 Q 1200,510 1190,560 Q 1180,610 1150,650 Q 1120,680 1080,700 Q 1050,715 1020,730" />
        </svg>
    </div>
</body>
</html>
