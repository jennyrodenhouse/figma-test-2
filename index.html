<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Navigation - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #1a1a1a;
        }

        .container {
            position: relative;
            display: inline-block;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
            cursor: pointer;
        }

        area {
            cursor: pointer;
        }

        .hover-overlay {
            position: absolute;
            transition: background-color 0.3s ease;
            cursor: pointer;
        }

        .hover-overlay:hover {
            background-color: rgba(255, 255, 255, 0.7);
        }

        .red-square {
            width: 90px;
            height: 90px;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="home-yellow.png" usemap="#navigation-map" alt="Home Yellow">

        <!-- Red square hover overlays -->
        <a href="red.html" class="hover-overlay red-square" style="left: 424px; top: 236px;"></a>
        <a href="red.html" class="hover-overlay red-square" style="left: 786px; top: 236px;"></a>
        <a href="red.html" class="hover-overlay red-square" style="left: 424px; top: 416px;"></a>
        <a href="red.html" class="hover-overlay red-square" style="left: 786px; top: 416px;"></a>
        <a href="red.html" class="hover-overlay red-square" style="left: 424px; top: 596px;"></a>
        <a href="red.html" class="hover-overlay red-square" style="left: 786px; top: 596px;"></a>

        <map name="navigation-map">
            <!-- Red squares -->
            <area shape="rect" coords="424,236,514,326" href="red.html" alt="Go to Red">
            <area shape="rect" coords="786,236,876,326" href="red.html" alt="Go to Red">
            <area shape="rect" coords="424,416,514,506" href="red.html" alt="Go to Red">
            <area shape="rect" coords="786,416,876,506" href="red.html" alt="Go to Red">
            <area shape="rect" coords="424,596,514,686" href="red.html" alt="Go to Red">
            <area shape="rect" coords="786,596,876,686" href="red.html" alt="Go to Red">

            <!-- Blue squares -->
            <area shape="rect" coords="514,326,604,416" href="blue.html" alt="Go to Blue">
            <area shape="rect" coords="696,326,786,416" href="blue.html" alt="Go to Blue">
            <area shape="rect" coords="514,506,604,596" href="blue.html" alt="Go to Blue">
            <area shape="rect" coords="696,506,786,596" href="blue.html" alt="Go to Blue">

            <!-- Green square (center) -->
            <area shape="rect" coords="604,416,696,506" href="green.html" alt="Go to Green">
        </map>
    </div>
</body>
</html>
